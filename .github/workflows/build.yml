name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (macOS, Apple Silicon)
    runs-on: macos-15   # Apple Silicon runner with newer Xcode
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16 (Swift 6)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Show Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Assemble app bundle
        run: ./Scripts/make_app.sh

      - name: Upload NoNap.app
        uses: actions/upload-artifact@v4
        with:
          name: NoNap-app
          path: NoNap.app
