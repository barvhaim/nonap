name: Release

# Builds NoNap and attaches NoNap.zip to a GitHub Release when you push a
# version tag like v1.0.0.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the release and upload assets

jobs:
  release:
    name: Build & publish release
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16 (Swift 6)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Build & zip
        run: ./Scripts/package_zip.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NoNap.zip
          generate_release_notes: true
          body: |
            ## NoNap ${{ github.ref_name }}

            Download `NoNap.zip` below, unzip, and **right-click NoNap.app → Open**
            the first time (the build is ad-hoc signed, not notarized).
